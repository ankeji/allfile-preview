<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>file-preview · UMD 免构建示例</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #020617;
      color: #e2e8f0;
      padding: 24px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .desc { color: #64748b; font-size: 13px; margin-bottom: 18px; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #93c5fd; }
    .section { margin-bottom: 24px; }
    .section-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .preview { width: 100%; height: 380px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .file-label {
      display: inline-flex;
      align-items: center;
      padding: 6px 14px;
      border: 1px solid #334155;
      border-radius: 8px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .file-label:hover { border-color: #3b82f6; background: #1e293b; }
  </style>
  <!-- 直接引用 UMD 产物（先执行 npm run build 构建出 dist/allfile-preview.umd.cjs） -->
  <script src="../../packages/core/dist/allfile-preview.umd.cjs"></script>
</head>
<body>
  <h1>file-preview · UMD 免构建接入</h1>
  <p class="desc">本页面通过 <code>&lt;script src=".../allfile-preview.umd.cjs"&gt;</code> 引入，可直接双击用 file:// 协议打开（媒体使用远程 URL）。所有解析库（pdf.js / docx-preview / SheetJS）均已内联，局域网部署只需此一个文件。</p>

  <div class="section">
    <div class="section-title">图片</div>
    <file-preview class="preview" type="image" src="https://picsum.photos/1200/800" name="远程图片.jpg"></file-preview>
  </div>

  <div class="section">
    <div class="section-title">视频</div>
    <file-preview
      class="preview"
      type="video"
      src="https://www.w3schools.com/html/mov_bbb.mp4"
      name="Big Buck Bunny.mp4"
    ></file-preview>
  </div>

  <div class="section">
    <div class="section-title">音频</div>
    <file-preview
      class="preview"
      type="audio"
      src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      name="SoundHelix Sound 1.mp3"
      color="#10b981"
    ></file-preview>
  </div>

  <div class="section">
    <div class="section-title">文档（PDF / TXT / DOCX / XLSX）</div>
    <p class="desc">file:// 协议下浏览器禁止 fetch 本地路径，请选择本机文件预览（转 blob URL，全程本地解析）。HTTP 环境可直接用局域网地址。</p>
    <div class="toolbar">
      <label class="file-label">选择本机文件…<input type="file" id="umd-file" hidden accept=".pdf,.txt,.log,.md,.json,.csv,.docx,.xlsx,image/*,video/*,audio/*" /></label>
    </div>
    <file-preview id="umd-doc" class="preview" type="pdf" src="https://mozilla.github.io/pdf.js/web/compressed.tracemonkey-pldi-09.pdf" name="compressed.tracemonkey-pldi-09.pdf（远程示例，需联网）"></file-preview>
  </div>

  <script>
    // UMD 全局变量 FilePreview 也可用于编程式访问
    document.querySelectorAll('file-preview').forEach(function (el) {
      el.addEventListener('error', function (e) {
        console.error('[file-preview] error', e.detail)
      })
    })
    console.log('UMD 全局变量：', window.FilePreview)

    // 本机文件选择 → blob URL（file:// 协议下也可用，类型按文件名扩展名检测）
    var docEl = document.getElementById('umd-doc')
    document.getElementById('umd-file').addEventListener('change', function (e) {
      var f = e.target.files && e.target.files[0]
      if (!f) return
      docEl.setAttribute('type', 'auto')
      docEl.setAttribute('name', f.name)
      docEl.setAttribute('src', URL.createObjectURL(f))
    })
  </script>
</body>
</html>
